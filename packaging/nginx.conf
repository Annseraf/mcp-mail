# mcp-mail behind nginx; certbot adds the TLS server block.
limit_req_zone $binary_remote_addr zone=mcpmail_auth:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    client_max_body_size 8m;

    location ~ ^/(authorize|login|token|register)$ {
        limit_req zone=mcpmail_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
