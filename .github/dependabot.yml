version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      patches:
        update-types: [patch]
    ignore:
      # Types must match the oldest Node we support (package.json engines), or
      # code could use APIs that crash there. Bump by hand with engines.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # typescript-eslint doesn't support TypeScript 7 yet (peer < 6.1). Remove
      # this once it does.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Major Node versions are chosen by hand (LTS only, and in the CI matrix).
      - dependency-name: node
        update-types: [version-update:semver-major]
